[workspace]
members = ["src/node-in-net-fs"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
bytes = { version = "1.6", features = ["serde"] }
serde_json = "1.0"

nodeinnet-protocol = { package = "nodeinnet-p2p", git = "https://github.com/node-in-net/p2p-common", branch = "main" }
p2p-node = { git = "https://github.com/node-in-net/p2p-common", branch = "main", default-features = false }
# Screen sharing off: Cisco's OpenH264 royalty grant covers Cisco's binary, not one built here.
client-core = { git = "https://github.com/node-in-net/p2p-common", branch = "main", default-features = false }
# Files only: no terminal, desktop, registry or proxy is served to a peer.
p2p-handlers = { git = "https://github.com/node-in-net/p2p-functions", branch = "main", default-features = false, features = ["feature-fm"] }
ic-plugin-api = { git = "https://github.com/ice-commander/plugin-api.git", branch = "main" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
